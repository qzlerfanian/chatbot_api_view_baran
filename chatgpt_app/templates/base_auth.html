{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}پنل احراز هویت{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font/dist/font-face.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Vazir', sans-serif;
            background: linear-gradient(to bottom, #ffffff, #87CEFA, #191970); /* سفید تا آبی آسمانی تا سرمه‌ای */

            background-size: cover;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header, .footer {
            background-color: rgba(19, 29, 79, 0.9);
            color: #EFE4D2;
            text-align: center;
            padding: 1rem;
        }

        .header-logo img {
            height: 60px;
        }

        .content {
            flex: 1;
            margin-top: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        form {
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 2rem;
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            color: #000;
        }

        input {
            padding: 10px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            padding: 12px;
            font-size: 1rem;
            background-color: #254D70;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        a {
            color: #007bff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-text">بیناتوسعه هوشمند باران</div>
        <div class="header-logo">
            <img src="{% static 'images/Asset_2 (1).png' %}" alt="لوگو">
        </div>
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <div class="footer">
        تمامی حقوق برای بیناتوسعه هوشمند باران محفوظ است.
    </div>

</body>
</html>

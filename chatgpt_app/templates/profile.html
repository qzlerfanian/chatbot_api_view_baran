
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>پنل کاربری</title>
  <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.003/web/misc/Farsi-Digits/Vazirmatn-FD-font-face.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Vazirmatn FD', sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(to top right, #dbeafe, #ffffff, #ede9fe);
    }

    header {
      background: linear-gradient(to right, #000d33, #001552);
      color: #ffffff;
      text-align: center;
      padding: 1.5rem 0;
      font-size: 1.30rem;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    .grid-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1.5rem;
  width: 100%;
  max-width: 1000px;
  margin: 0 auto;
  padding: 2rem 1rem;
}

a.button-link {
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
}


    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      gap: 1.5rem;
    }

a.button-link {
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 1.2rem;
  font-weight: 500;
  font-family: 'Vazirmatn FD', sans-serif; /* اعمال فونت مشخص */
  color: #fcfcfc; /* متن سفید */
  padding: 1rem;
  border-radius: 1rem;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  transition: background-color 0.3s ease;
  text-decoration: none;
}



    a.button-chat {
      background-color: #001552FF;
        backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
    }

    a.button-chat:hover {
      background-color: #004c83;
    }

    a.button-dashboard {
      background-color: #001552FF;
        backdrop-filter: blur(10px);
    }

    a.button-dashboard:hover {
      background-color: #004c83;
    }

    a.button-password {
      background-color: #001552FF;
        backdrop-filter: blur(10px);
    }

    a.button-password:hover {
      background-color: #004c83;
    }

    footer {
      background-color: #001552FF;
      color: #fdfdfd;
      text-align: center;
      font-size: 0.875rem;
      padding: 1rem 0;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    Hello! WellCome to Profile
  </header>

  <!-- Main Content -->
    <!-- Main Content -->
  <main>
    <div class="grid-container">
      <a href="/chat" class="button-link button-chat">ChatBot</a>
      <a href="{% url 'upload_file' %}" class="button-link button-dashboard">Ask from file</a>
      <a href="{% url 'upload_audio' %}" class="button-link button-dashboard">voice to text</a>
      <a href="{% url 'generate_image' %}" class="button-link button-dashboard">text to image</a>
      <a href="/dashboard" class="button-link button-dashboard">Dashboard</a>
      <a href="/change-password" class="button-link button-password">change password</a>
      <a href="/logout" class="button-link button-password">Logout</a>
    </div>
  </main>


  <!-- Footer -->
  <footer>
    تمامی حقوق برای بیناتوسعه محفوظ است.
  </footer>

</body>
</html>

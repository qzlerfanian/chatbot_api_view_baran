{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font/dist/font-face.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Vazir', sans-serif;
            background: linear-gradient(to bottom, #ffffff, #f0f8ff, #e6f0ff);
            background-size: cover;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            height: 70px;
            background-color: rgb(0, 21, 82);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 2rem;
            border-bottom: 1px solid #ccc;
            z-index: 1000;
        }

        .header-text {
            font-size: 1.4rem;
            font-weight: bold;
            color: #fcfcfc;
        }

        .content {
            flex: 1;
            margin-top: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        form {
            background-color: rgb(255, 255, 255);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgb(0, 7, 23);
            padding: 2rem;
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            color: #ffffff;
        }

        input {
            padding: 10px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        input:focus {
            border-color: #28a745;
            outline: none;
        }

        button {
            padding: 12px;
            font-size: 1rem;
            background-color: rgb(0, 21, 82);
            color: #fffcfc;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #00248c;
        }

        .signup-link, .forgot-link {
            text-align: center;
            margin-top: -0.5rem;
        }

        .signup-link a, .forgot-link a {
            text-decoration: none;
        }

        .signup-link a {
            color: #007bff;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .forgot-link a {
            color: #dc3545;
        }

        .forgot-link a:hover {
            text-decoration: underline;
        }

        .messages {
            margin-bottom: 1rem;
            color: red;
            text-align: center;
        }

        .footer {
            text-align: center;
            padding: 1rem;
            background-color: rgb(0, 21, 82);
            font-size: 0.9rem;
            color: #f9f9fa;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-text">Hello! Wellcome to BaranSmart</div>
    </div>

    <div class="content">

        <p>!Please Enter Your Username And Password Correctly</p>

        <form method="post">
            {% csrf_token %}

            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    {{ message }}
                {% endfor %}
            </div>
            {% endif %}

            <input name="username" placeholder="Username" value="{{ request.POST.username }}">
            <input name="password" type="password" placeholder="Password">
            <button type="submit">Login</button>

            <div class="signup-link">
                <a href="{% url 'register' %}">Register</a>

            </div>

            <div class="forgot-link">
                <a href="{% url 'password_reset' %}">Forget Password</a>
            </div>
        </form>
    </div>

    <div class="footer">
        تمامی حقوق برای بیناتوسعه هوشمند باران محفوظ است.
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سامانه تولید عکس | بیناتوسعه هوشمند باران</title>
    <style>
        body {
            font-family: 'Vazir', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #000d33;
            color: #ffffff;
            padding: 10px;
            text-align: center;
        }

        footer {
            background-color: #000d33;
            color: #ffffff;
            padding: 10px;
            text-align: center;
            font-size: 0.9em;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        main {
            max-width: 600px;
            height: calc(100vh - 140px); /* کل ارتفاع منهای هدر و فوتر */
            margin: 40px auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 33, 71, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* دکمه پایین */
        }

        form {
            display: flex;
            flex-direction: column;
            height: 50%;
        }

        textarea {
            flex: 1;
            font-size: 1em;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            resize: none; /* کاربر نتونه دستی کوچک کنه */
            margin-bottom: 15px;
        }

        button {
            background-color: #000d33;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
        }

        button:hover {
            background-color: #0074b2;
        }

        img {
            margin-top: 20px;
            border-radius: 8px;
            max-width: 100%;
        }

        .alert {
            background-color: #ffcccc;
            border: 1px solid #cc0000;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            color: #990000;
        }
    </style>
</head>
<body>
    <header>
        <h2>Baran Smart Convert Text to Image</h2>
    </header>

    <main>
        {% if messages %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <textarea id="id_prompt" name="prompt" placeholder="Enter image description..."></textarea>
            <button type="submit">Generate Image</button>
        </form>

        {% if image %}
            <h2>Result:</h2>
            <p>{{ image.prompt }}</p>
            <img src="{{ image.image.url }}" alt="Generated Image">
        {% endif %}
    </main>

    <footer>
        تمامی حقوق برای بیناتوسعه محفوظ است ©
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>چت با تصویر</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    @font-face { font-family: 'Vazir'; src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font/dist/Vazir.woff2') format('woff2'); font-display: swap; }
    body { font-family: 'Vazir', Tahoma, sans-serif; direction: rtl; margin: 0; background: linear-gradient(180deg, #f7fafc, #eef2f7); color: #1f2937; }

    .container { max-width: 920px; margin: 0 auto; padding: 20px 16px; }

    .card { background: #ffffff; border: 1px solid #e5e7eb; box-shadow: 0 8px 20px rgba(0,0,0,0.06); border-radius: 16px; padding: 16px; }
    .section { margin-bottom: 16px; }

    h2 { margin: 0 0 12px; font-size: 1.1rem; color: #374151; }

    /* فرم آپلود */
    #image-form { display: flex; gap: 10px; align-items: center; }
    #image-form input[type="file"] { flex: 1; padding: 10px; border: 1px solid #d1d5db; border-radius: 12px; background: #f9fafb; }
    #image-form button { background: linear-gradient(135deg, #4f46e5, #3b82f6); color: #fff; border: none; border-radius: 12px; padding: 10px 16px; cursor: pointer; transition: .2s; }
    #image-form button:hover { filter: brightness(1.05); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,.3); }

    /* چت */
    .chat-card { display: flex; flex-direction: column; height: 70vh; }
    #chat-box { flex: 1 1 auto; border: 1px solid #e5e7eb; border-radius: 14px; padding: 16px; overflow-y: auto; background: #fafafa; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 16px; line-height: 1.7; font-size: .98rem; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; border-bottom-right-radius: 4px; }
    .msg.assistant { align-self: flex-start; background: #f3f4f6; color: #111827; border-bottom-left-radius: 4px; }

    .scroll-container { position: sticky; bottom: 8px; display: flex; justify-content: center; padding: 6px 0; pointer-events: none; }
    .scroll-btn { pointer-events: auto; background: #505050; color: #fff; border: none; border-radius: 20px; padding: 8px 14px; font-size: .9rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,.15); }

    #chat-form { display: flex; gap: 10px; align-items: center; padding-top: 12px; position: sticky; bottom: 0; background: #fff; }
    #chat-form input[name="question"] { flex: 1; padding: 14px 16px; border: 1px solid #d1d5db; border-radius: 18px; background: #ffffff; font-size: 1rem; }
    #chat-form button { background: linear-gradient(135deg, #4f46e5, #3b82f6); color: #fff; border: none; border-radius: 12px; padding: 12px 18px; cursor: pointer; transition: .2s; }
    #chat-form button:hover { filter: brightness(1.05); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,.3); }

    /* موبایل */
    @media (max-width: 768px) {
      .container { padding: 16px 12px; }
      .chat-card { height: calc(100vh - 230px); }
      #chat-box { background: #fff; }
      .msg { max-width: 100%; font-size: 1.05rem; padding: 12px 16px; }
      .scroll-btn { padding: 10px 16px; font-size: 1rem; }
      #chat-form { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card section">
      <h2>📷 آپلود عکس</h2>
      <form id="image-form" enctype="multipart/form-data">
        <input type="file" name="image" required>
        <button type="submit">ارسال</button>
      </form>
    </div>

    <div class="card chat-card">
      <h2>💬 چت</h2>
      <div id="chat-box"></div>
      <div class="scroll-container">
        <button id="scroll-down-btn" class="scroll-btn">⬇️ رفتن به آخر گفتگو</button>
      </div>
      <form id="chat-form">
        <input type="text" name="question" placeholder="سوالت رو بنویس..." required>
        <button type="submit">بپرس</button>
      </form>
    </div>
  </div>

<script>
const chatBox = document.getElementById("chat-box");

document.getElementById("image-form").onsubmit = async (e) => {
  e.preventDefault();
  let formData = new FormData(e.target);
  let res = await axios.post("/chatimage/upload_image/", formData);
  chatBox.innerHTML += `<div class=\"msg assistant\">🤖: ${res.data.answer}</div>`;
};

document.getElementById("chat-form").onsubmit = async (e) => {
  e.preventDefault();
  let formData = new FormData(e.target);
  let q = formData.get("question");
  chatBox.innerHTML += `<div class=\"msg user\">👤: ${q}</div>`;
  e.target.reset();

  let res = await axios.post("/chatimage/ask/", formData);
  chatBox.innerHTML += `<div class=\"msg assistant\">🤖: ${res.data.answer}</div>`;
  chatBox.scrollTop = chatBox.scrollHeight;
};

// اسکرول به انتهای گفتگو با دکمه
document.addEventListener('click', function(e){
  if (e.target && e.target.id === 'scroll-down-btn') {
    chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
  }
});
</script>
</body>
</html>
